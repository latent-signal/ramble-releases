name: Feature request
description: Suggest a change or an addition to Ramble
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public.** Anyone can read what you write here.

        Describe the idea in general terms. Do not attach screenshots or recordings that show private data from your screen.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where Ramble gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Ramble to do?
      description: Describe the behavior you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Describe any workaround you use today.
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have checked that this issue holds no screenshots, recordings, paths, or other private data from my screen.
          required: true
